server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La configuración de entorno nunca debe cachearse
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Fallback de SPA: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}